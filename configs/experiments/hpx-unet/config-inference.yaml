experiment_dir: FME_OUTPUT_DIR
n_forward_steps: 7300
forward_steps_in_memory: 10
checkpoint_path: FME_CHECKPOINT_PATH
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: yikwill-university-of-washington
loader:
  start_indices:
    times:
      - '2009-01-01T00:00:00'
      - '2009-02-15T00:00:00'
      - '2009-04-01T00:00:00'
      - '2009-05-15T00:00:00'
      - '2009-07-01T00:00:00'
      - '2009-08-15T00:00:00'
      - '2009-10-01T00:00:00'
      - '2009-11-15T00:00:00'
      - '2010-01-01T00:00:00'
      - '2010-02-15T00:00:00'
      - '2010-04-01T00:00:00'
      - '2010-05-15T00:00:00'
      - '2010-07-01T00:00:00'
      - '2010-08-15T00:00:00'
      - '2010-10-01T00:00:00'
      - '2010-11-15T00:00:00'
  dataset:
    data_path: FME_TRAIN_DIR
    file_pattern: 2025-10-04-healpix-era5-dataset.zarr
    engine: zarr
    spatial_dimensions: healpix
  num_data_workers: 4
aggregator:
  log_zonal_mean_images: false
  log_histograms: true
  time_mean_reference_data: FME_STATS_DIR/time-mean.nc
data_writer:
  save_prediction_files: true
  save_monthly_files: true
  metrics:
    - type: mean
      target: denorm
    - type: mean
      target: norm
    - type: step_mean
      step: 20
      target: denorm
    - type: step_mean
      step: 20
      target: norm
    - type: power_spectrum
    - type: time_mean
      target: denorm
    - type: time_mean
      target: norm
    - type: histogram
    - type: annual