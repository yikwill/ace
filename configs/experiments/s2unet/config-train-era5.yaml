experiment_dir: FME_OUTPUT_DIR
save_checkpoint: true
validate_using_ema: true
max_epochs: 120
ema:
  decay: 0.999
inference:
  - n_forward_steps: 7300
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
          - '1996-01-01T00:00:00'
          - '1996-01-15T00:00:00'
          - '1996-02-15T00:00:00'
          - '1996-03-01T00:00:00'
          - '1996-04-01T00:00:00'
          - '1996-05-15T00:00:00'
          - '1996-06-01T00:00:00'
          - '1996-06-15T00:00:00'
          - '1996-07-01T00:00:00'
          - '1996-08-15T00:00:00'
          - '1996-09-01T00:00:00'
          - '1996-09-15T00:00:00'
          - '1996-10-01T00:00:00'
          - '1996-11-15T00:00:00'
          - '1996-12-01T00:00:00'
          - '1996-12-15T00:00:00'
      dataset:
        data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
      num_data_workers: 1
    aggregator:
      histogram:
        enabled: true
      time_mean_reference_data: /global/cfs/projectdirs/e3sm/yikwill/datasets/2026-03-19-era5-1deg-8layer-stats-1990-2019/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-s2unet
  entity: yikwill-university-of-washington
train_loader:
  batch_size: 32
  num_data_workers: 1
  prefetch_factor: 1
  dataset:
    concat:
    - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        stop_time: '1995-12-31'
    - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '2011-01-01'
        stop_time: '2019-12-31'
    - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '2021-01-01'
validation:
  loader:
    batch_size: 32
    num_data_workers: 1
    prefetch_factor: 2
    dataset:
      data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1996-01-01'
        stop_time: '1997-12-31'
optimization:
  use_gradient_accumulation: false
  enable_automatic_mixed_precision: true
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_forward_steps: 4
  loss:
    type: MSE
    weights:
      air_temperature_0: 0.5
      air_temperature_1: 0.5
      eastward_wind_0: 0.5
      northward_wind_0: 0.5
      specific_total_water_0: 0.5
      specific_total_water_1: 0.25
      specific_total_water_2: 0.5
      PRATEsfc: 0.5
      h500: 10
      TMP850: 5
      Q2m: 0.5
      DLWRFsfc: 2
      ULWRFsfc: 5
      USWRFsfc: 2
      DSWRFsfc: 2
      USWRFtoa: 2
      tendency_of_total_water_path_due_to_advection: 0.5
stepper:
  step:
    type: single_module
    config:
      builder:
        type: NoiseConditionedSphericalUNet
        config:
          noise_embed_dim: 0
          embed_dims: [128, 64, 32]
          depths: [1, 1, 1]
          scale_factor: 2
          grid: legendre-gauss
          grid_internal: legendre-gauss
          activation_function: gelu
          filter_bases:
            - basis_type: harmonic
              kernel_shape: [4, 4]
            - basis_type: zernike
              kernel_shape: [4]
            - basis_type: fourier-bessel
              kernel_shape: [3, 3]
            - basis_type: isotropic morlet
              kernel_shape: [8]
          filter_basis_norm_mode: nodal
          mlp_ratio: 2.0
          path_drop_rate: 0.0
          mlp_drop_rate: 0.0
          downsampling_mode: conv
          upsampling_mode: bilinear
      normalization:
        network:
          global_means_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/2026-03-19-era5-1deg-8layer-stats-1990-2019/centering.nc
          global_stds_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/2026-03-19-era5-1deg-8layer-stats-1990-2019/scaling-full-field.nc
        residual:
          global_means_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/2026-03-19-era5-1deg-8layer-stats-1990-2019/centering.nc
          global_stds_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/2026-03-19-era5-1deg-8layer-stats-1990-2019/scaling-residual.nc
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - Q2m
        - PRATEsfc
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
      next_step_forcing_names:
      - DSWRFtoa
      in_names:
      - land_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
      - HGTsfc
      - global_mean_co2
      - PRESsfc
      - surface_temperature
      - TMP2m
      - Q2m
      - UGRD10m
      - VGRD10m
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      out_names:
      - PRESsfc
      - surface_temperature
      - TMP2m
      - Q2m
      - UGRD10m
      - VGRD10m
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
