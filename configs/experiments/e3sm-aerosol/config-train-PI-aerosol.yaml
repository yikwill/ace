experiment_dir: FME_OUTPUT_DIR
save_checkpoint: true
validate_using_ema: true
max_epochs: 40
ema:
  decay: 0.999
inference:
  - n_forward_steps: 5110
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
          - '1940-01-01T00:00:00'
          - '1941-01-01T00:00:00'
          - '1945-01-01T00:00:00'
          - '1950-01-01T00:00:00'
          - '1955-01-01T00:00:00'
          - '1960-01-01T00:00:00'
          - '1965-01-01T00:00:00'
          - '1970-01-01T00:00:00'
          - '1975-01-01T00:00:00'
          - '1980-01-01T00:00:00'
          - '1985-01-01T00:00:00'
          - '1990-01-01T00:00:00'
          - '1995-01-01T00:00:00'
          - '2000-01-01T00:00:00'
          - '2005-01-01T00:00:00'
          - '2010-01-01T00:00:00'
      dataset:
        data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.F2010.PI.aigo/run
        file_pattern: v3.LR.F2010.PI.aigo.eam.h0.*.nc
        overwrite:
          multiply_scalar:
            PRECT: 1000.0 # m/s to kg/m^2/s
      num_data_workers: 4
    aggregator:
      log_histograms: true
      time_mean_reference_data: /global/cfs/cdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-PI-prect-kgm2s/v3.LR.F2010.PI.aigo/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: yikwill-university-of-washington
train_loader:
  batch_size: 16
  num_data_workers: 4
  prefetch_factor: 2
  time_buffer: 10
  dataset:
    data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.F2010.PI.aigo/run
    file_pattern: v3.LR.F2010.PI.aigo.eam.h0.*.nc
    overwrite:
      multiply_scalar:
        PRECT: 1000.0 # m/s to kg/m^2/s
    subset:
      start_time: '1940-01-01'
      stop_time: '2010-12-31'
validation:
  loader:
    batch_size: 32
    num_data_workers: 4
    prefetch_factor: 2
    dataset:
      data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.F2010.PI.aigo/run
      file_pattern: v3.LR.F2010.PI.aigo.eam.h0.*.nc
      overwrite:
        multiply_scalar:
          PRECT: 1000.0 # m/s to kg/m^2/s
      subset:
        start_time: '2011-01-01'
        stop_time: '2016-05-31'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_forward_steps: 2
  loss:
    type: MSE
    weights:
      T_0: 0.5
      T_1: 0.5
      U_0: 0.5
      V_0: 0.5
      STW_0: 0.5
      STW_1: 0.25
      STW_2: 0.5
      PRECT: 2
      STWat2m: 0.5
      FLDS: 2
      FLUS: 5
      FSDS: 2
      FSUS: 2
      FSUTOA: 2
      DTENDTTW: 0.5
stepper:
  step:
    type: single_module
    config:
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 384
          noise_embed_dim: 0
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
      normalization:
        network:
          global_means_path: /global/cfs/cdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-PI-prect-kgm2s/v3.LR.F2010.PI.aigo/centering.nc
          global_stds_path: /global/cfs/cdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-PI-prect-kgm2s/v3.LR.F2010.PI.aigo/scaling-full-field.nc
        residual:
          global_means_path: /global/cfs/cdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-PI-prect-kgm2s/v3.LR.F2010.PI.aigo/centering.nc
          global_stds_path: /global/cfs/cdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-PI-prect-kgm2s/v3.LR.F2010.PI.aigo/scaling-residual.nc
      ocean:
        surface_temperature_name: TS
        ocean_fraction_name: OCNFRAC
        interpolate: true
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        force_positive_names:
          - STW_0
          - STW_1
          - STW_2
          - STW_3
          - STW_4
          - STW_5
          - STW_6
          - STW_7
          - STWat2m
          - PRECT
          - FLUS
          - FLUT
          - FLDS
          - FSDS
          - FSUS
          - FSUTOA
      next_step_forcing_names:
        - SOLIN
        - aerindexall
        - colccn.3
      in_names:
