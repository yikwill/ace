experiment_dir: FME_OUTPUT_DIR
# Reduced emis forcings from e3sm-aerosol-{PI,PD}-emis-forcing-6hourly-1945-1980.zarr
# 12 channels (6 species × sfc+elev) chosen for largest PI→PD relative change:
#   SO2, so4_a1, num_a1, bc_a4, num_a4, pom_a4
# (metric: RMS(PD−PI) / mean|PI|; drop PI≡PD chem/DMS/E90/NO2 and weaker so4_a2/SOAG0).
# aerindexall / colccn.3 remain prognostic. Uses e3sm-aerosol-stats-aerosol-prognostic/combined.
save_checkpoint: true
validate_using_ema: true
# Once per epoch (~5665 batches); default 1000 caused frequent 7GB host-RAM spikes.
checkpoint_every_n_batches: 5665
max_epochs: 40
ema:
  decay: 0.999
inference:
  - name: PI
    n_forward_steps: 5110
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
          - '1945-01-01T00:00:00'
          - '1947-01-01T00:00:00'
          - '1949-01-01T00:00:00'
          - '1951-01-01T00:00:00'
          - '1953-01-01T00:00:00'
          - '1955-01-01T00:00:00'
          - '1957-01-01T00:00:00'
          - '1959-01-01T00:00:00'
          - '1961-01-01T00:00:00'
          - '1963-01-01T00:00:00'
          - '1965-01-01T00:00:00'
          - '1967-01-01T00:00:00'
          - '1969-01-01T00:00:00'
          - '1971-01-01T00:00:00'
          - '1973-01-01T00:00:00'
          - '1975-01-01T00:00:00'
      dataset:
        # Main zarr first for ak_*/bk_* vertical coords; emis zarr has none.
        merge:
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
            file_pattern: e3sm-aerosol-PI-1945-1980.zarr
            engine: zarr
            overwrite:
              multiply_scalar:
                PRECT: 1000.0 # m/s to kg/m^2/s
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
            file_pattern: e3sm-aerosol-PI-emis-forcing-6hourly-1945-1980.zarr
            engine: zarr
      num_data_workers: 1
    aggregator:
      log_histograms: false
      time_mean_reference_data: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-aerosol-prognostic/PI/time-mean.nc
  - name: PD
    n_forward_steps: 5110
    forward_steps_in_memory: 40
    loader:
      start_indices:
        times:
          - '1945-01-01T00:00:00'
          - '1947-01-01T00:00:00'
          - '1949-01-01T00:00:00'
          - '1951-01-01T00:00:00'
          - '1953-01-01T00:00:00'
          - '1955-01-01T00:00:00'
          - '1957-01-01T00:00:00'
          - '1959-01-01T00:00:00'
          - '1961-01-01T00:00:00'
          - '1963-01-01T00:00:00'
          - '1965-01-01T00:00:00'
          - '1967-01-01T00:00:00'
          - '1969-01-01T00:00:00'
          - '1971-01-01T00:00:00'
          - '1973-01-01T00:00:00'
          - '1975-01-01T00:00:00'
      dataset:
        merge:
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
            file_pattern: e3sm-aerosol-PD-1945-1980.zarr
            engine: zarr
            overwrite:
              multiply_scalar:
                PRECT: 1000.0 # m/s to kg/m^2/s
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
            file_pattern: e3sm-aerosol-PD-emis-forcing-6hourly-1945-1980.zarr
            engine: zarr
      num_data_workers: 1
    aggregator:
      log_histograms: false
      time_mean_reference_data: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-aerosol-prognostic/PD/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace-e3sm-aerosol
  entity: yikwill-university-of-washington
train_loader:
  batch_size: 16
  num_data_workers: 1
  prefetch_factor: 2
  time_buffer: 10
  dataset:
    # Main concat first for vertical coords (ak_*/bk_*); emis second.
    merge:
      - concat:
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
            file_pattern: e3sm-aerosol-PI-1945-1980.zarr
            engine: zarr
            overwrite:
              multiply_scalar:
                PRECT: 1000.0 # m/s to kg/m^2/s
            subset:
              start_time: '1945-01-01'
              stop_time: '1975-12-31'
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
            file_pattern: e3sm-aerosol-PD-1945-1980.zarr
            engine: zarr
            overwrite:
              multiply_scalar:
                PRECT: 1000.0 # m/s to kg/m^2/s
            subset:
              start_time: '1945-01-01'
              stop_time: '1975-12-31'
      - concat:
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
            file_pattern: e3sm-aerosol-PI-emis-forcing-6hourly-1945-1980.zarr
            engine: zarr
            subset:
              start_time: '1945-01-01'
              stop_time: '1975-12-31'
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
            file_pattern: e3sm-aerosol-PD-emis-forcing-6hourly-1945-1980.zarr
            engine: zarr
            subset:
              start_time: '1945-01-01'
              stop_time: '1975-12-31'
validation:
  - name: PI
    loader:
      batch_size: 16
      num_data_workers: 1
      prefetch_factor: 2
      dataset:
        merge:
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
            file_pattern: e3sm-aerosol-PI-1945-1980.zarr
            engine: zarr
            overwrite:
              multiply_scalar:
                PRECT: 1000.0 # m/s to kg/m^2/s
            subset:
              start_time: '1976-01-01'
              stop_time: '1980-12-31'
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
            file_pattern: e3sm-aerosol-PI-emis-forcing-6hourly-1945-1980.zarr
            engine: zarr
            subset:
              start_time: '1976-01-01'
              stop_time: '1980-12-31'
  - name: PD
    loader:
      batch_size: 16
      num_data_workers: 1
      prefetch_factor: 2
      dataset:
        merge:
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
            file_pattern: e3sm-aerosol-PD-1945-1980.zarr
            engine: zarr
            overwrite:
              multiply_scalar:
                PRECT: 1000.0 # m/s to kg/m^2/s
            subset:
              start_time: '1976-01-01'
              stop_time: '1980-12-31'
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets
            file_pattern: e3sm-aerosol-PD-emis-forcing-6hourly-1945-1980.zarr
            engine: zarr
            subset:
              start_time: '1976-01-01'
              stop_time: '1980-12-31'
optimization:
  use_gradient_accumulation: true
  # FP32: host OOM is handled by checkpoint_every_n_batches + malloc_trim, not AMP.
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_forward_steps: 2
  loss:
    type: MSE
    weights:
      T_0: 0.5
      T_1: 0.5
      U_0: 0.5
      V_0: 0.5
      STW_0: 0.5
      STW_1: 0.25
      STW_2: 0.5
      PRECT: 2
      STWat2m: 0.5
      FLDS: 2
      FLUS: 5
      FSUS: 2
      FSDS: 2
      FSUTOA: 5
      FLUT: 5
      cdnc: 2
      lcc: 2
      lwp: 2
      DTENDTTW: 0.5
stepper:
  step:
    type: single_module
    config:
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 384
          noise_embed_dim: 0
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
      normalization:
        network:
          global_means_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-aerosol-prognostic/combined/centering.nc
          global_stds_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-aerosol-prognostic/combined/scaling-full-field.nc
        residual:
          global_means_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-aerosol-prognostic/combined/centering.nc
          global_stds_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-aerosol-prognostic/combined/scaling-residual.nc
      ocean:
        surface_temperature_name: TS
        ocean_fraction_name: OCNFRAC
        interpolate: true
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        force_positive_names:
          - STW_0
          - STW_1
          - STW_2
          - STW_3
          - STW_4
          - STW_5
          - STW_6
          - STW_7
          - STWat2m
          - PRECT
          - FLUS
          - FLUT
          - FLDS
          - FSDS
          - FSUS
          - FSUTOA
      next_step_forcing_names:
        - SOLIN
        - emis_SO2_sfc
        - emis_SO2_elev
        - emis_so4_a1_sfc
        - emis_so4_a1_elev
        - emis_num_a1_sfc
        - emis_num_a1_elev
