experiment_dir: /pscratch/sd/y/yikwill/fme-output/zarr-smoke-test
save_checkpoint: false
validate_using_ema: false
max_epochs: 1
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: false
  project: ace
  entity: yikwill-university-of-washington
train_loader:
  batch_size: 2
  num_data_workers: 2
  prefetch_factor: 2
  time_buffer: 2
  dataset:
    merge:
      - concat:
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-PI-monthly-clim-6hourly-1945-1980
            file_pattern: 'v3.LR.F2010.PI.aigo.eam.h0.1945-0[12].nc'
            subset:
              start_time: '1945-01-01'
              stop_time: '1945-02-28'
          - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-PD-monthly-clim-6hourly-1945-1980
            file_pattern: 'v3.LR.F2010.aigo.eam.h0.1945-0[12].nc'
            subset:
              start_time: '1945-01-01'
              stop_time: '1945-02-28'
      - concat:
          - data_path: /pscratch/sd/y/yikwill
            file_pattern: e3sm-aerosol-PI-smoke.zarr
            engine: zarr
            overwrite:
              multiply_scalar:
                PRECT: 1000.0
            subset:
              start_time: '1945-01-01'
              stop_time: '1945-02-28'
          - data_path: /pscratch/sd/y/yikwill
            file_pattern: e3sm-aerosol-PD-smoke.zarr
            engine: zarr
            overwrite:
              multiply_scalar:
                PRECT: 1000.0
            subset:
              start_time: '1945-01-01'
              stop_time: '1945-02-28'
validation:
  loader:
    batch_size: 2
    num_data_workers: 2
    prefetch_factor: 2
    dataset:
      merge:
        - concat:
            - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-PI-monthly-clim-6hourly-1945-1980
              file_pattern: 'v3.LR.F2010.PI.aigo.eam.h0.1945-0[12].nc'
              subset:
                start_time: '1945-01-01'
                stop_time: '1945-02-28'
            - data_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-PD-monthly-clim-6hourly-1945-1980
              file_pattern: 'v3.LR.F2010.aigo.eam.h0.1945-0[12].nc'
              subset:
                start_time: '1945-01-01'
                stop_time: '1945-02-28'
        - concat:
            - data_path: /pscratch/sd/y/yikwill
              file_pattern: e3sm-aerosol-PI-smoke.zarr
              engine: zarr
              overwrite:
                multiply_scalar:
                  PRECT: 1000.0
              subset:
                start_time: '1945-01-01'
                stop_time: '1945-02-28'
            - data_path: /pscratch/sd/y/yikwill
              file_pattern: e3sm-aerosol-PD-smoke.zarr
              engine: zarr
              overwrite:
                multiply_scalar:
                  PRECT: 1000.0
              subset:
                start_time: '1945-01-01'
                stop_time: '1945-02-28'
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_forward_steps: 2
  loss:
    type: MSE
    weights:
      T_0: 0.5
      T_1: 0.5
      U_0: 0.5
      V_0: 0.5
      STW_0: 0.5
      STW_1: 0.25
      STW_2: 0.5
      PRECT: 2
      STWat2m: 0.5
      FLDS: 2
      FLUS: 5
      FSUS: 2
      FSDS: 2
      FSUTOA: 2
      DTENDTTW: 0.5
stepper:
  step:
    type: single_module
    config:
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 384
          noise_embed_dim: 0
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
      normalization:
        network:
          global_means_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-aerosol-clim-forcing/combined/centering.nc
          global_stds_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-aerosol-clim-forcing/combined/scaling-full-field.nc
        residual:
          global_means_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-aerosol-clim-forcing/combined/centering.nc
          global_stds_path: /global/cfs/projectdirs/e3sm/yikwill/datasets/e3sm-aerosol-stats-aerosol-clim-forcing/combined/scaling-residual.nc
      ocean:
        surface_temperature_name: TS
        ocean_fraction_name: OCNFRAC
        interpolate: true
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        force_positive_names:
          - STW_0
          - STW_1
          - STW_2
          - STW_3
          - STW_4
          - STW_5
          - STW_6
          - STW_7
          - STWat2m
          - PRECT
          - FLUS
          - FLUT
          - FLDS
          - FSDS
          - FSUS
          - FSUTOA
